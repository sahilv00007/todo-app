<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple to-do list that saves your tasks in the browser.">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>

    <form id="form" autocomplete="off">
      <label for="text" class="visually-hidden">New task</label>
      <input type="text" id="text" placeholder="What do you need to do?" maxlength="120" required>
      <button type="submit" class="primary">Add</button>
    </form>

    <div class="toolbar">
      <div class="filters" id="filters" role="group" aria-label="Filter tasks">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="done" aria-pressed="false">Done</button>
      </div>
      <button type="button" id="clear" class="link-button">Clear completed</button>
    </div>

    <ul id="list" aria-live="polite"></ul>
    <p id="empty" class="empty" hidden>Nothing here yet.</p>

    <p id="count" class="count">0 tasks left</p>
  </main>
</body>
</html>
